name: Update public market monitor data

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_public_data.py"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: monitor-data-update-and-pages
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout website code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: monitor-data
          path: monitor-data-branch
          fetch-depth: 0

      - name: Restore previous data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          for f in latest.json history.json etf_shares.json market_flow.json; do
            if [ -f "monitor-data-branch/data/$f" ]; then
              cp "monitor-data-branch/data/$f" "data/$f"
            fi
          done
          echo "Restored prior data files:"
          ls -lh data/*.json || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip akshare

      - name: Fetch public data
        run: python scripts/fetch_public_data.py

      - name: Validate generated JSON
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          required = ["latest.json", "history.json", "etf_shares.json", "market_flow.json"]
          for name in required:
              p = Path("data") / name
              if not p.exists():
                  raise SystemExit(f"Required data file missing: {p}")
              obj = json.loads(p.read_text(encoding="utf-8"))
              print(f"{name}: valid JSON; updated_at={obj.get('updated_at', 'n/a')}")
          etf = json.loads(Path("data/etf_shares.json").read_text(encoding="utf-8"))
          funds = etf.get("funds", [])
          print(f"ETF total={len(funds)}; fresh={sum(x.get('status') == 'ok' for x in funds)}; stale={sum(x.get('status') == 'stale' for x in funds)}; missing={sum(x.get('status') == 'missing' for x in funds)}")
          flow = json.loads(Path("data/market_flow.json").read_text(encoding="utf-8"))
          rows = flow.get("indices", [])
          print(f"Market flow total={len(rows)}; fresh={sum(x.get('status') == 'ok' for x in rows)}; stale={sum(x.get('status') == 'stale' for x in rows)}; missing={sum(x.get('status') == 'missing' for x in rows)}")
          PY

      - name: Save data to monitor-data branch
        shell: bash
        run: |
          set -euo pipefail
          git -C monitor-data-branch config user.name "github-actions[bot]"
          git -C monitor-data-branch config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p monitor-data-branch/data
          for f in latest.json history.json etf_shares.json market_flow.json; do
            cp "data/$f" "monitor-data-branch/data/$f"
          done
          cd monitor-data-branch
          git add data/latest.json data/history.json data/etf_shares.json data/market_flow.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update public monitoring data"
            git push origin HEAD:monitor-data
          else
            echo "No data changes to commit."
          fi

  deploy:
    needs: update-data
    if: needs.update-data.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout website code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout latest data
        uses: actions/checkout@v4
        with:
          ref: monitor-data
          path: data-branch

      - name: Assemble website with latest data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          for f in latest.json history.json etf_shares.json market_flow.json; do
            if [ ! -f "data-branch/data/$f" ]; then
              echo "Missing required data file: data-branch/data/$f"
              exit 1
            fi
            cp "data-branch/data/$f" "data/$f"
          done

      - name: Verify published data snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ["etf_shares.json", "market_flow.json"]:
              d = json.loads((Path("data") / name).read_text(encoding="utf-8"))
              rows = d.get("funds", []) if name == "etf_shares.json" else d.get("indices", [])
              fresh = sum(x.get("status") == "ok" for x in rows)
              stale = sum(x.get("status") == "stale" for x in rows)
              missing = sum(x.get("status") == "missing" for x in rows)
              print(f"{name}: updated_at={d.get('updated_at')}; total={len(rows)}; fresh={fresh}; stale={stale}; missing={missing}")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
