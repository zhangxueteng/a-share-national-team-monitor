name: Update public market monitor data
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_public_data.py"
      - ".github/workflows/update-data.yml"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install akshare
      - name: Fetch public RSS data
        run: python scripts/fetch_public_data.py
      - name: Commit data history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.json data/etf_shares.json data/market_flow.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update public monitoring data"
            git push
          else
            echo "No data changes to commit."
          fi
  deploy:
    needs: update-data
    if: always() && (needs.update-data.result == 'success' || needs.update-data.result == 'failure')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main after data update
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify published data snapshot
        run: |
          python - <<'PYJSON'
          import json
          from pathlib import Path
          for name in ['etf_shares.json', 'market_flow.json']:
              p = Path('data') / name
              d = json.loads(p.read_text(encoding='utf-8'))
              if name == 'etf_shares.json':
                  rows = d.get('funds', [])
                  fresh = sum(x.get('status') == 'ok' for x in rows)
                  stale = sum(x.get('status') == 'stale' for x in rows)
                  missing = sum(x.get('status') == 'missing' for x in rows)
                  print(f'{name}: updated_at={d.get("updated_at")}; total={len(rows)}; fresh={fresh}; stale={stale}; missing={missing}')
              else:
                  rows = d.get('indices', [])
                  fresh = sum(x.get('status') == 'ok' for x in rows)
                  stale = sum(x.get('status') == 'stale' for x in rows)
                  missing = sum(x.get('status') == 'missing' for x in rows)
                  print(f'{name}: updated_at={d.get("updated_at")}; total={len(rows)}; fresh={fresh}; stale={stale}; missing={missing}')
          PYJSON
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
