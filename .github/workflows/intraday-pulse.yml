name: Intraday ETF pulse

on:
  schedule:
    # UTC 01:00-07:45 = China time 09:00-15:45, weekdays.
    # GitHub may delay scheduled workflows; this is near-real-time, not tick data.
    - cron: "*/15 1-7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-intraday-pulse
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout website code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: monitor-data
          path: monitor-data-branch
          fetch-depth: 0

      - name: Restore latest intraday snapshot
        run: |
          mkdir -p data
          if [ -f monitor-data-branch/data/intraday_pulse.json ]; then
            cp monitor-data-branch/data/intraday_pulse.json data/intraday_pulse.json
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect public ETF quotes
        run: python scripts/fetch_intraday_pulse.py

      - name: Validate pulse JSON
        run: python -m json.tool data/intraday_pulse.json > /dev/null

      - name: Save snapshot to monitor-data branch
        shell: bash
        run: |
          set -euo pipefail
          git -C monitor-data-branch config user.name "github-actions[bot]"
          git -C monitor-data-branch config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p monitor-data-branch/data
          cp data/intraday_pulse.json monitor-data-branch/data/intraday_pulse.json
          cd monitor-data-branch
          git add data/intraday_pulse.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update intraday ETF pulse"
            git pull --rebase origin monitor-data
            git push origin HEAD:monitor-data
          else
            echo "No intraday data changes."
          fi
